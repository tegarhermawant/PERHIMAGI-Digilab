<!-- Extracted Navbar Mobile Toggle and Dropdown from tentang.html -->

<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
        <img src="https://perhimagi.org/wp-content/uploads/2025/05/Logo-Perhimagi.png" alt="Logo PERHIMAGI" class="w-10 h-10 object-contain" />
        <div>
          <h1 class="text-xl font-bold text-red-600">PERHIMAGI</h1>
          <p class="text-xs text-slate-500 tracking-wider">DIGITAL LIBRARY</p>
        </div>
      </div>
      <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
        <a href="https://perhimagi.org" class="hover:text-red-600 transition">Home</a>
        <a href="/index.html" class="hover:text-red-600 transition">Library</a>
        <a href="/alat/" class="hover:text-red-600 transition">Alat</a>
        <a href="/tentang.html" class="text-red-600 font-bold border-b-2 border-red-600 pb-1">Tentang</a>
      </div>
      <button id="mobileMenuBtn" class="md:hidden p-2 text-slate-600" aria-label="Buka menu">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Dropdown (Hidden by default) -->
  <div id="mobileNavDropdown" class="hidden md:hidden bg-white border-t border-slate-100 shadow-lg absolute w-full left-0 z-50 slide-down">
    <div class="flex flex-col p-4 space-y-3">
      <a href="https://perhimagi.org" class="flex items-center gap-3 p-2 rounded-lg hover:bg-red-50 hover:text-red-600 text-slate-600 font-medium">
        <i data-lucide="home" class="w-5 h-5"></i> Home
      </a>
      <a href="/index.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-red-50 hover:text-red-600 text-slate-600 font-medium w-full text-left">
        <i data-lucide="book" class="w-5 h-5"></i> Library
      </a>
      <a href="/alat/" class="flex items-center gap-3 p-2 rounded-lg hover:bg-red-50 hover:text-red-600 text-slate-600 font-medium w-full text-left">
        <i data-lucide="wrench" class="w-5 h-5"></i> Alat
      </a>
      <a href="/tentang.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-red-50 hover:text-red-600 text-slate-600 font-medium w-full text-left">
        <i data-lucide="info" class="w-5 h-5"></i> Tentang
      </a>
    </div>
  </div>
</header>

<script>
  // Mobile Menu Logic
  document.addEventListener("DOMContentLoaded", function () {
    const menuButton = document.getElementById("mobileMenuBtn");
    const mobileNav = document.getElementById("mobileNavDropdown");

    if (menuButton && mobileNav) {
      menuButton.addEventListener("click", () => {
        mobileNav.classList.toggle("hidden");
      });
    }
  });
</script>
